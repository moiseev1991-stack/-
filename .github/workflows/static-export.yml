name: Static export

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Allow writing back to the repo (push to deploy branch)
permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build:static

      - name: Generate favicon.ico and apple-touch-icon.png from SVG
        run: |
          sudo apt-get install -y librsvg2-bin imagemagick
          # 256x256 PNG from SVG
          rsvg-convert -w 256 -h 256 public/favicon.svg -o /tmp/favicon-256.png
          # apple-touch-icon 180x180
          rsvg-convert -w 180 -h 180 public/favicon.svg -o out/apple-touch-icon.png
          # Multi-size ICO (16, 32, 48)
          for size in 16 32 48; do
            rsvg-convert -w $size -h $size public/favicon.svg -o /tmp/favicon-${size}.png
          done
          convert /tmp/favicon-16.png /tmp/favicon-32.png /tmp/favicon-48.png out/favicon.ico

      - name: Create Arabic directory aliases in out/
        run: node scripts/add-arabic-aliases.mjs

      # Push the compiled out/ folder as the root of the "deploy" branch.
      # Plesk should be pointed at this branch, not master.
      - name: Push out/ to deploy branch
        run: |
          cd out
          git init -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "deploy: static export from ${{ github.sha }}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin deploy

      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: out/
          if-no-files-found: error
