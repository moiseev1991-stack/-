name: Static export

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build:static
      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: out/
          if-no-files-found: error
